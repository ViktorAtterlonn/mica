name: Feature request
description: Describe a persistence problem Mica could help solve.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is difficult with the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed usage
      description: Include a small API example and alternatives you considered.
    validations:
      required: true
