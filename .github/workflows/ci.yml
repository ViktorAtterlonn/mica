name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / MongoDB ${{ matrix.mongo }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.21.0']
        mongo: ['8.0.15', '8.2.2']
    env:
      MICA_MONGO_IMAGE: mongo:${{ matrix.mongo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  consumers:
    name: TypeScript ${{ matrix.typescript }} consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.9.3', '6.0.3', '7.0.2']
    env:
      MICA_TYPESCRIPT: ${{ matrix.typescript }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bench:types
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: consumer-typescript-${{ matrix.typescript }}
          path: .tmp/type-bench/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
